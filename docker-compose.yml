# Plan Commercial — single-container compose file.
#
# Brings up the FastAPI server (which also serves the built React UI) on
# port 8000 with persistent volumes for the user's uploaded images and the
# generated archive.
#
#   docker compose up -d --build       # build + start in the background
#   docker compose logs -f app         # follow logs
#   docker compose down                # stop (volumes persist)
#   docker compose down -v             # stop AND delete user data — careful

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: plan-commercial:latest
    container_name: plan-commercial
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # The container's session.py reads this and uses it as the root for
      # state.db + images/ + archive/. HARDCODED on purpose — if you leave
      # this overridable, a stray PC_DATA_DIR in the shell (e.g. from
      # run_dev.bat) leaks into the volume target below and breaks the
      # mount with "too many colons".
      PC_DATA_DIR: /app/data
      # SAP credentials — read once at app startup to populate the
      # in-process cache (and on every /api/sap/sync call). Override
      # SAP_USERNAME / SAP_PASSWORD in a local .env file alongside this
      # compose file — never commit them. Server/database default to
      # the values in api/routes/sap.py.
      SAP_SERVER:   ${SAP_SERVER:-192.168.1.240}
      SAP_DATABASE: ${SAP_DATABASE:-DATAWAREHOUSE}
      SAP_USERNAME: ${SAP_USERNAME:-}
      SAP_PASSWORD: ${SAP_PASSWORD:-}
    volumes:
      # Single persistent mount. Only the HOST side is configurable — the
      # container side is always /app/data so a stray PC_DATA_DIR can't
      # poison the mount spec.
      #
      # PC_DATA_HOST defaults to `./data` (auto-created next to docker-
      # compose.yml). Override in .env to:
      #   - an absolute path: PC_DATA_HOST=C:/plan_commercial   (Windows)
      #                       PC_DATA_HOST=/var/lib/pc          (Linux)
      #   - a Docker-managed named volume: PC_DATA_HOST=pc_data (opaque)
      #
      # Built-in graphics live under /app/assets/builtin in the image and
      # are NOT a volume — they ship with the image and update with releases.
      - ${PC_DATA_HOST:-./data}:/app/data
    # SAP import on a LAN address (e.g. 192.168.1.240) needs the container
    # to see the host's network. Three options:
    #   1. Keep bridge networking (default below) — works when Docker
    #      Desktop's bridge can route to your LAN. Try this first.
    #   2. Switch to host networking (uncomment `network_mode: host` below).
    #      On Windows requires Docker Desktop 4.34+ with "Enable host
    #      networking" turned on in Settings → Features in development.
    #      When this is on, the `ports:` block above is ignored — the
    #      container binds to port 8000 on the host directly.
    #   3. Add a route for the SAP host explicitly via `extra_hosts`.
    extra_hosts:
      - "sap.local:192.168.1.240"     # gives the container a DNS shortcut
    # network_mode: host              # uncomment if (1) doesn't reach SAP
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Only declared when PC_DATA_HOST is unset (the default). When the user
  # sets PC_DATA_HOST to a real path, Compose binds that path instead and
  # this named volume goes unused — harmless.
  pc_data:

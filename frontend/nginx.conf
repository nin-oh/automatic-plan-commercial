server {
    listen 3000;
    root /usr/share/nginx/html;

    # Serve React app
    location /react {
        alias /usr/share/nginx/html/react;
        index index.html;
        try_files $uri $uri/ /react/index.html;
    }

    # Proxy API calls to Django
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy static files to Django
    location /static/ {
        proxy_pass http://web:8000;
    }

    # Proxy auth to Django
    location /login/ {
        proxy_pass http://web:8000;
    }

    location /logout/ {
        proxy_pass http://web:8000;
    }

    # Proxy admin to Django
    location /admin/ {
        proxy_pass http://web:8000;
    }

    # Root redirect to React
    location = / {
        return 302 /react/;
    }
}
